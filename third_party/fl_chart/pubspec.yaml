name: fl_chart
description: A highly customizable Flutter chart library that supports Line Chart, Bar Chart, Pie Chart, Scatter Chart, and Radar Chart.
version: 1.3.0
publish_to: none
homepage: https://flchart.dev/
repository: https://github.com/imaNNeo/fl_chart
issue_tracker: https://github.com/imaNNeo/fl_chart/issues
documentation: https://flchart.dev/docs

environment:
  sdk: ">=3.6.2 <4.0.0"
  flutter: ">=3.27.4"

funding:
  - https://github.com/sponsors/imaNNeo
  - https://www.buymeacoffee.com/fl_chart

dependencies:
  equatable: ">=2.1.0 <4.0.0"
  flutter:
    sdk: flutter
  vector_math: ^2.2.0

dev_dependencies:
  analyzer: ^14.4.0
  build_runner: ^2.8.0
  dart_style: ^3.1.0
  flutter_test:
    sdk: flutter
  mockito: ^5.5.1
  path: ^1.9.0
  pub_semver: ^2.2.0
  very_good_analysis: ^11.0.0

topics:
  - chart
  - charts
  - visualization
  - graph
  - diagram
