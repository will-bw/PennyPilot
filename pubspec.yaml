name: pennypilot
description: 本地优先的 Android 与 iOS 个人记账工具。
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  speech_to_text: ^7.5.0
  sqflite: ^2.4.5
  url_launcher: ^6.3.3
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
flutter:
  uses-material-design: true
